<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
<h1>My Tasks</h1>
<button id="themeToggle">🌙</button>
<p id="taskCount">0 tasks left</p>
</header>
<form id="taskForm">
<input type="date" id="taskDate">
<input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off" required>
<button type="submit">Add</button>
</form>
<div class="filters">
<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="active">Active</button>
<button class="filter-btn" data-filter="completed">Completed</button>
</div>
<ul id="taskList"></ul>
<footer class="contact">
<a href="https://github.com/lacky-369-prsad" target="_blank">GitHub</a>
<a href="https://instagram.com/your-username" target="_blank">Instagram</a>
<a href="https://linkedin.com/in/your-username" target="_blank">LinkedIn</a>
<a href="mailto:lackyprasad52@gmail.com">Email</a>
</footer>
</div>
<script src="script.js"></script>
</body>
</html>
